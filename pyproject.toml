[project]
name = "jeva"
version = "0.1.0"
description = "A 2B browser-agent decision model you can train and run yourself — client, prompt and state rendering"
keywords = ["decision-model", "browser-agent", "agent", "llm", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.urls]
Homepage = "https://github.com/chemany/jeva"
Issues = "https://github.com/chemany/jeva/issues"
ModelCard = "https://github.com/chemany/jeva/blob/main/docs/hf-model-card.md"

[project.optional-dependencies]
train = ["torch>=2.0", "transformers>=4.48", "peft>=0.10", "datasets>=3.0", "accelerate>=1.0", "safetensors>=0.4"]
eval = ["matplotlib>=3.8"]
serve = ["vllm>=0.8"]

[project.scripts]
jeva = "jeva.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jeva"]

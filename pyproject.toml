[project]
name = "jeva"
version = "0.1.0"
description = "A 2B browser-agent decision model you can train and run yourself"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.0", "transformers>=4.48", "peft>=0.10", "datasets>=3.0", "accelerate>=1.0", "safetensors>=0.4"]
eval = ["matplotlib>=3.8"]
serve = ["vllm>=0.8"]

[project.scripts]
jeva = "jeva.serve:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jeva"]

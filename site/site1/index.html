<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Flight Search</title>
<style>body{font-family:system-ui;margin:40px;max-width:640px}label{display:block;margin:14px 0 4px}
input,select,button{padding:7px;font-size:14px;width:100%;box-sizing:border-box}button{margin-top:18px}</style></head><body>
<h1>Search flights</h1>
<form action="flight-results.html" method="get">
  <fieldset><legend>Ticket type</legend>
    <label><input type="radio" name="trip" value="round" checked> Round trip</label>
    <label><input type="radio" name="trip" value="oneway"> One way</label>
  </fieldset>
  <label for="from">Where from?</label><input id="from" name="from" placeholder="Origin city">
  <label for="to">Where to?</label><input id="to" name="to" placeholder="Destination city">
  <label for="dep">Departure</label><input id="dep" name="dep" placeholder="Date">
  <label for="cabin">Cabin</label>
  <select id="cabin" name="cabin"><option selected>Economy</option><option>Premium economy</option><option>Business</option><option>First</option></select>
  <label for="pax">Passengers</label>
  <select id="pax" name="pax"><option selected>1 adult</option><option>2 adults</option><option>3 adults</option></select>
  <button type="submit">Search</button>
</form></body></html>
